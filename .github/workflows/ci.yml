name: CI/CD API

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'ghcr.io/dsql-mongkey' }}
  IMAGE: ${{ vars.IMAGE_PREFIX || 'ghcr.io/dsql-mongkey' }}/jiandco-api
  MIGRATIONS_IMAGE: ${{ vars.IMAGE_PREFIX || 'ghcr.io/dsql-mongkey' }}/jiandco-api-migrations

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jiandco_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jiandco_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jiandco_db?sslmode=disable
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      JWT_ISSUER: jiandco-api
      SEED_DEVELOPER_PASSWORD: Developer123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas
        uses: ariga/atlas-action/setup@v1

      - name: Download modules
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l cmd config internal pkg)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Validate migrations
        run: atlas migrate validate --env local

      - name: Apply migrations
        run: atlas migrate apply --env local

      - name: Seed
        run: go run ./cmd/seed

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrations
          push: true
          tags: |
            ${{ env.MIGRATIONS_IMAGE }}:${{ github.sha }}
            ${{ env.MIGRATIONS_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: jiandco-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy API and migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || '/opt/jiandco' }}"
            flock /tmp/jiandco-deploy.lock -c '
              sed -i "s|^API_TAG=.*|API_TAG=${{ github.sha }}|" .env
              grep -q "^API_TAG=" .env || echo "API_TAG=${{ github.sha }}" >> .env
              docker compose --profile tools pull jiandco-api jiandco-migrate
              docker compose --profile tools run --rm jiandco-migrate
              docker compose up -d --wait jiandco-api
            '
            docker image prune -f --filter until=168h
